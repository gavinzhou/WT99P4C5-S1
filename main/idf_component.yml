## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf: ">=5.3"
  espressif/esp-brookesia:
    version: "0.4.*"
  esp_video:
    version: "0.8.*"
    public: true
  espressif/esp_wifi_remote:
    version: "0.14.2"
    rules:
      - if: "target in [esp32p4, esp32h2]"
  # 2026-04-24 M2.6 (ADR-022): Host-side esp_hosted is pinned to a vendored
  # fork that carries HyperFi patches (double-free fix in rpc_core.c,
  # STA_START duplicate drop in rpc_wrap.c, SDIO debug-printf cleanup).
  #
  # Repo  : git@github.com:pacport/esp-hosted-mcu.git  (2026-06-05 PacPort org 迁移済、旧 gavinzhou/esp-hosted-mcu)
  # Branch: hyperfi/host-v2013-backport
  # Tag   : hyperfi-m2.9-host-v2013-backport   (M2.9 E2E CSI 成功时的 snapshot)
  #
  # Why `override_path` + directory named `espressif__esp_hosted`:
  #   - ESP-IDF + component manager derive the CMake component name from the
  #     directory name. For a namespaced component (`namespace/name`), the
  #     convention is `namespace__name` with a double underscore — this is
  #     what `managed_components/` uses and what `main` expects in its
  #     REQUIRES list (`espressif__esp_hosted`).
  #   - Pointing override_path at a directory with any other name (e.g. a
  #     descriptive one like `esp-hosted-mcu-host-vendored`) causes CMake to
  #     register it under THAT name and `main` fails with
  #     "Failed to resolve component 'espressif__esp_hosted': unknown name".
  #   - So the rule: vendored esp_hosted MUST live at a path whose leaf
  #     directory is literally `espressif__esp_hosted`.
  #
  # v2.12.6 slave + v2.0.13 host is the combo that works on P4 eco2 +
  # IDF v5.5-beta1 + PSRAM. See ADR-022 + esp-hosted-mcu issue #33.
  espressif/esp_hosted:
    version: "2.0.13"
    override_path: "../../hyperfi/firmware/espressif__esp_hosted"
  ## ADR-020 方案 A — P4 自烧 C5 via UART (esp-serial-flasher library)
  ## PINNED ==1.11.0: the onboard C5 is esp32c5-eco2 (ROM 2025-01-21). 1.7.0
  ## (the 2026-04-22 PoC era version) crashes inside esp_loader_connect on
  ## eco2 silicon (Instruction access fault, garbage PC). 1.11.0 supports
  ## eco2. NOTE: the long-standing "Connect failed err=2" was NOT a version
  ## issue — it was a broken P4.IO26→C5.BOOT jumper (C5 booted SPI mode 0x38
  ## instead of download 0x28); fixed 2026-06-22.
  espressif/esp-serial-flasher:
    version: "==1.11.0"
    rules:
      - if: "target == esp32p4"
  ## ADR-023 M3.1 — Spatial Shutter IFFT/FFT 加速（V9 benchmark で使用済、
  ## 128-pt IFFT 138µs、ADR-011 Stage 2 予算 8ms に対し 60× 余裕）
  espressif/esp-dsp:
    version: "^1.4.0"
  ## ADR-023 M3.5.1 — nanopb is NOT on the ESP component registry under any
  ## reasonable namespace (verified 2026-04-27 via `idf.py add-dependency`).
  ## We vendor the 7 runtime files (pb.h, pb_{common,encode,decode}.{h,c}) +
  ## pre-generated telemetry.pb.{c,h} into main/. See CMakeLists.txt.
  ## Vendor source: https://github.com/nanopb/nanopb tag nanopb-0.4.8